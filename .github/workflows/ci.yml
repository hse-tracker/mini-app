name: CI Pipeline

on:
  pull_request:
    branches: [ "a" ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check (Vue-TSC)
        run: npm run type-check

      - name: Linters
        # 'lint' in package.json runs ESLint + Oxlint
        run: npm run lint

      - name: Build Test
        run: npm run build
